# Example configuration for Tau Ceti (TauCetiProject/TauCeti). Copy this file and the
# `.lean-review/` directory beside it to the root of the target repository's default branch.
project     = "Tau Ceti"
description = "an AIs-welcome Lean 4 library downstream of Mathlib"
source_root = "TauCeti"
namespace   = "TauCeti"
mode        = "scoreboard"
ci_check    = "build"
# The nine built-in rubrics, plus Tau Ceti's own quality-pass from .lean-review/rubrics/.
rubrics     = ["correctness", "reuse", "attribution", "api-design", "generality",
               "placement", "naming", "documentation", "proof-quality", "quality-pass"]
