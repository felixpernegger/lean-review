[project]
name = "lean-review"
version = "0.3.0"
description = "AI review of Lean 4 pull requests on your own Claude or Codex subscription."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# No Python dependencies: the engine shells out to `git`, `gh`, and the reviewer CLIs.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lean-review = "lean_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lean_review"]

[tool.setuptools.package-data]
lean_review = ["rubrics/*.md", "rubrics/references/*.md", "profiles/*/*.toml",
               "profiles/*/*.md", "profiles/*/*/*.md"]

# The folder READMEs are for repository readers; nothing loads them at run time.
[tool.setuptools.exclude-package-data]
lean_review = ["rubrics/README.md", "profiles/*/README.md"]
